allOf:
  - $ref: "./BaseTrainingSet.yaml"
  - type: object
    properties:
      setOrder:
        type: integer
        description: Indicates on what place in training this set is
        minimum: 0
        maximum: 49
      styleId:
        type: string
        format: uuid
      components:
        type: array
        minItems: 1
        maxItems: 50
        items:
          $ref: "./NewSetComponent.yaml"
    required:
      - setOrder
      - repeat
      - distanceMeters
      - type
