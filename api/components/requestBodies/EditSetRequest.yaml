description: Request for editing a set. For editing components of the set use `PUT /sets/{id}`
required: true
content:
  application/json:
    schema:
      allOf:
        - $ref: "../schemas/BaseTrainingSet.yaml"
        - type: object
          properties:
            styleId:
              type: string
              format: uuid
              nullable: true
            description:
              type: string
              nullable: true
            equipment:
              type: array
              items:
                $ref: "../schemas/enums/EquipmentEnum.yaml"
            start:
              nullable: true
              allOf:
                - $ref: "../schemas/start/Start.yaml"
