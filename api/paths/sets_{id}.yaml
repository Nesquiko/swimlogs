parameters:
  - $ref: "../components/parameters/IdParam.yaml"

patch:
  summary: Edit set
  tags:
    - Sets
  operationId: editSet
  requestBody:
    $ref: "../components/requestBodies/EditSetRequest.yaml"
  responses:
    200:
      $ref: "../components/responses/TrainingResponse.yaml"
    400:
      $ref: "../components/responses/ErrorResponse.yaml"
    404:
      $ref: "../components/responses/ErrorResponse.yaml"

put:
  summary: Replace set's components
  tags:
    - Sets
  operationId: replaceSetComponents
  requestBody:
    $ref: "../components/requestBodies/ReplaceSetComponentsRequest.yaml"
  responses:
    200:
      $ref: "../components/responses/TrainingResponse.yaml"
    400:
      $ref: "../components/responses/ErrorResponse.yaml"
    404:
      $ref: "../components/responses/ErrorResponse.yaml"

delete:
  summary: Delete a set
  tags:
    - Sets
  operationId: deleteSet
  responses:
    204:
      description: Set was deleted
    404:
      $ref: "../components/responses/ErrorResponse.yaml"
