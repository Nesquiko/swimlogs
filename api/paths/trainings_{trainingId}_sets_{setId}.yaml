parameters:
  - $ref: "../components/parameters/TrainingIdParam.yaml"
  - $ref: "../components/parameters/SetIdParam.yaml"

patch:
  summary: Edit set
  tags:
    - Trainings
  operationId: editSet
  requestBody:
    $ref: "../components/requestBodies/EditSetRequest.yaml"
  responses:
    200:
      $ref: "../components/responses/EditSetResponse.yaml"
    400:
      $ref: "../components/responses/errors/InvalidSetResponse.yaml"
    404:
      $ref: "../components/responses/errors/NotFoundResponse.yaml"

delete:
  summary: Delete a set
  tags:
    - Trainings
  operationId: deleteSet
  responses:
    204:
      description: Set was deleted
    404:
      $ref: "../components/responses/errors/NotFoundResponse.yaml"
